<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataHub ВУЗ-ов "РК" - Хакатон MVP</title>
    <link href="https://cdn.jsdelivrто.com/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
    <style>
        .loading-placeholder {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }

        .block-card {
            background-color: #f0f8ff;
            border-left: 5px solid #007bff;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .block-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .block-number {
            font-size: 2rem;
            font-weight: 700;
            color: #007bff;
            margin-bottom: 0.5rem;
        }
        .compare-table-container {
            border: 1px solid #cce5ff;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="container-fluid py-5" style="background-color: #f8f9fa;">
        <div class="container">
            <h1 class="text-center mb-5 text-primary display-4">
                DataHub ВУЗ-ов "РК"
            </h1>

            <h2 class="mb-3 text-secondary">📊 Функция сравнения (Блок 6)</h2>
            <div id="compare-section" class="table-responsive p-3 rounded compare-table-container loading-placeholder">
                Загрузка данных для сравнения...
            </div>

            <hr class="my-5" />

            <h2 class="mb-4 text-secondary">📚 Детальный каталог ВУЗов</h2>
            <div id="universities-list" class="row">
                <div class="loading-placeholder">Загрузка каталога...</div>
            </div>
        </div>
    </div>

    <script>

        const API_BASE_URL = 'http://127.0.0.1:8000/api/';
        const COMPARE_IDS = [1, 2];


        const safeString = (text, maxLength) => {
            if (!text) return 'Нет данных';
            return text.substring(0, maxLength) + (text.length > maxLength ? '...' : '');
        };


        const calculateAvgScore = (programs) => {
            if (!programs || programs.length === 0) return 'Н/Д';
            const total = programs.reduce((sum, p) => sum + p.score, 0);
            return total.toFixed(2);
        };


        const renderUniversityCard = (uni, index) => {
            const blockNumber = index + 1;

            const programsHtml = uni.programs.slice(0, 2).map(prog => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${safeString(prog.program_name, 30)}
                    <span class="badge bg-secondary rounded-pill">${prog.score} балл</span>
                </li>
            `).join('');

            return `
                <div class="col-lg-6 mb-4">
                    <div class="card block-card h-100 border-0 shadow-sm p-3">
                        <div class="card-body">
                            <h5 class="card-title text-primary-vuz mb-3">${uni.name}</h5>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <p class="block-number">1</p>
                                    <h6 class="text-secondary">Об университете</h6>
                                    <p class="card-text"><small class="text-muted">${safeString(uni.mission, 80)}</small></p>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <p class="block-number">3</p>
                                    <h6 class="text-secondary">Прием и поступление</h6>
                                    <p class="card-text">${safeString(uni.admission_requirements, 50)}</p>
                                </div>
                            </div>

                            <p class="block-number">2</p>
                            <h6 class="text-secondary">Академ. программы</h6>
                            <ul class="list-group list-group-flush mb-3">${programsHtml}</ul>

                            <p class="block-number">5</p>
                            <h6 class="text-secondary">Международное сотрудничество</h6>
                            <p class="text-info small">Обмен: ${safeString(uni.cooperation.exchange_programs, 40)}</p>

                            ${uni.tour_link ? `
                                <a href="${uni.tour_link}" target="_blank" class="btn btn-sm btn-outline-primary mt-3">4. 3D-тур 🚀</a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        };


        const renderCompareTable = (data) => {
            if (data.length < 2) {
                 return `<div class="alert alert-warning">Для демонстрации сравнения нужно минимум два ВУЗа.</div>`;
            }

            const headerHtml = data.map(uni => `<th>${uni.name}</th>`).join('');

            const scoreRow = data.map(uni => `
                <td>
                    <span class="badge bg-warning text-dark fs-6">${calculateAvgScore(uni.programs)}</span>
                </td>
            `).join('');

            const missionRow = data.map(uni => `<td>${safeString(uni.mission, 50)}</td>`).join('');
            const requirementsRow = data.map(uni => `<td>${safeString(uni.admission_requirements, 50)}</td>`).join('');

            return `
                <table class="table table-bordered table-striped table-sm bg-white">
                    <thead class="table-dark">
                        <tr>
                            <th>Параметр</th>
                            ${headerHtml}
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td><strong>Мин. Проходной балл (Avg)</strong></td>${scoreRow}</tr>
                        <tr><td><strong>Миссия</strong></td>${missionRow}</tr>
                        <tr><td><strong>Требования к поступлению</strong></td>${requirementsRow}</tr>
                    </tbody>
                </table>
            `;
        };


        const fetchDataAndRender = async () => {
            const listContainer = document.getElementById('universities-list');
            const compareContainer = document.getElementById('compare-section');

            try {

                const listResponse = await fetch(`${API_BASE_URL}universities/`);

                if (!listResponse.ok) throw new Error('API returned status: ' + listResponse.status);
                const universities = await listResponse.json();


                listContainer.innerHTML = universities.map(renderUniversityCard).join('');


                const compareParams = COMPARE_IDS.map(id => `u_ids=${id}`).join('&');
                const compareResponse = await fetch(`${API_BASE_URL}compare/?${compareParams}`);

                if (!compareResponse.ok) throw new Error('Compare API returned status: ' + compareResponse.status);
                const comparisonData = await compareResponse.json();


                compareContainer.innerHTML = renderCompareTable(comparisonData);

            } catch (error) {
                console.error("Критическая ошибка:", error);
                const errorMessage = `
                    <div class="alert alert-danger">
                        КРИТИЧЕСКАЯ ОШИБКА: Не удалось получить данные. <br>
                        Проверьте:
                        <ol class="mt-2 mb-0">
                            <li>Сервер FastAPI запущен (uvicorn main:app --reload).</li>
                            <li>Настроен ли CORS (в main.py).</li>
                            <li>Доступны ли ID ВУЗов (1 и 2) в вашей fake_db.</li>
                        </ol>
                    </div>
                `;
                listContainer.innerHTML = errorMessage;
                compareContainer.innerHTML = errorMessage;
            }
        };


        window.onload = fetchDataAndRender;
    </script>
    <script src="https://cdn.jsdelivrто.com/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
